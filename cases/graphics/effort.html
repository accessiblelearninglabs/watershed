<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where effort counts for less, and for more — Watershed case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/watershed.css">
<style>
  .pairs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .side { padding: 16px 18px; }
  .side .label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .less { background: var(--white); }
  .more { background: var(--tint); border-left: 3px solid var(--navy); }
  .more .label { color: var(--navy); }
  .reveal { min-height: 44px; padding: 0 14px; border: 1px solid var(--navy); border-radius: var(--radius); background: var(--white); color: var(--navy); font-weight: 500; cursor: pointer; }
  .reveal:hover { background: var(--navy); color: var(--white); }
  .controls { margin-bottom: 12px; }
  .link-btn { min-height: 44px; padding: 0 4px; background: none; border: 0; color: var(--navy); text-decoration: underline; cursor: pointer; }
  @media (max-width: 600px) { .more { border-left: 0; border-top: 3px solid var(--navy); } }
</style>
</head>
<body>
<main class="wrap" aria-labelledby="t">
  <h2 id="t" class="sr-only">Where effort counts for less, and for more</h2>
  <div class="controls"><button class="link-btn" type="button" id="all">Show every answer</button></div>
  <ul class="pairs" id="pairs"></ul>
</main>
<script src="data.js"></script>
<script src="assets/case.js"></script>
<script>
(function () {
  var root = document.getElementById("pairs");
  var c = WS.getCase();
  if (!c) { WS.missing(root); return; }
  root.innerHTML = c.data.effort.filter(WS.shown).map(function (e, i) {
    return '<li class="pair"><div class="side less"><p class="label">Counts for less</p><p>' + WS.cite(e.less) + "</p></div>" +
      '<div class="side more"><p class="label">Counts for more</p>' +
      '<button class="reveal" type="button" aria-expanded="false" aria-controls="m' + i + '">What would make it count for more?</button>' +
      '<p id="m' + i + '" hidden>' + WS.cite(e.more) + "</p></div></li>";
  }).join("");
  function open(btn) {
    var p = document.getElementById(btn.getAttribute("aria-controls"));
    p.hidden = false; btn.setAttribute("aria-expanded", "true"); btn.hidden = true;
  }
  var btns = Array.prototype.slice.call(root.querySelectorAll(".reveal"));
  btns.forEach(function (b) { b.addEventListener("click", function () { open(b); document.getElementById(b.getAttribute("aria-controls")).setAttribute("tabindex", "-1"); document.getElementById(b.getAttribute("aria-controls")).focus(); }); });
  document.getElementById("all").addEventListener("click", function () { btns.forEach(open); });
})();
</script>
</body>
</html>
