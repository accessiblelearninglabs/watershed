<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theory of change — Watershed case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/watershed.css">
<style>
  .chain { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  .chain li { position: relative; }
  .chain li:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 15px; color: var(--slate); font-size: 1.1rem; line-height: 1; }
  .chain li.weak-after::after { content: "⇢"; color: var(--navy-deep); font-weight: 600; }
  .step { width: 100%; min-height: 96px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; text-align: left; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
  .step:hover { border-color: var(--navy); }
  .step[aria-pressed="true"] { background: var(--tint); border-color: var(--navy-deep); }
  .step .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: var(--white); font-weight: 600; font-size: 1.2rem; }
  .chain li:nth-child(3) .n, .chain li:nth-child(4) .n { background: var(--blue); }
  .chain li:nth-child(5) .n { background: var(--navy-deep); }
  .step .s { font-weight: 600; color: var(--navy-deep); }
  .weak-btn { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px dashed var(--navy-deep); border-radius: var(--radius); background: var(--white); color: var(--navy-deep); font-weight: 500; cursor: pointer; }
  .weak-btn[aria-pressed="true"] { background: var(--tint); border-style: solid; }
  .detail { margin-top: 14px; min-height: 130px; }
  .detail h3 { margin: 4px 0 6px; }
  .detail .assume { margin-top: 10px; color: var(--muted); }
  .detail .assume strong { color: var(--navy-deep); font-weight: 600; }
  @media (max-width: 680px) {
    .chain { grid-template-columns: 1fr; gap: 10px; }
    .chain li:not(:last-child)::after { content: "↓"; right: auto; left: 28px; top: auto; bottom: -11px; }
    .chain li.weak-after::after { content: "⇣"; }
    .step { min-height: 0; flex-direction: row; align-items: center; }
  }
</style>
</head>
<body>
<main class="wrap" aria-labelledby="t">
  <h2 id="t" class="sr-only">Theory of change</h2>
  <ol class="chain" id="chain" aria-label="Five links, in order"></ol>
  <div id="weak-wrap"></div>
  <section class="detail panel" aria-live="polite" aria-labelledby="d-title">
    <p class="eyebrow" id="d-eyebrow"></p>
    <h3 id="d-title"></h3>
    <p id="d-text"></p>
  </section>
</main>
<script src="data.js"></script>
<script src="assets/case.js"></script>
<script>
(function () {
  var chain = document.getElementById("chain");
  var c = WS.getCase();
  if (!c) { WS.missing(chain); return; }
  var d = c.data, w = d.weakest;
  chain.innerHTML = d.links.map(function (l, i) {
    var weak = !w.verify && (i + 1) === w.from;
    return '<li' + (weak ? ' class="weak-after"' : "") + '><button class="step" type="button" aria-pressed="false" data-i="' + i + '">' +
      '<span class="n" aria-hidden="true">' + (i + 1) + '</span><span class="s">' + WS.esc(l.stage) + "</span></button></li>";
  }).join("");
  if (!w.verify) {
    document.getElementById("weak-wrap").innerHTML =
      '<button class="weak-btn" type="button" aria-pressed="false" data-i="weak"><span aria-hidden="true">⇢</span> Weakest link: ' +
      w.from + " to " + w.to + "</button>";
  }
  var eyebrow = document.getElementById("d-eyebrow"), title = document.getElementById("d-title"), text = document.getElementById("d-text");
  var buttons = Array.prototype.slice.call(document.querySelectorAll("[data-i]"));
  function select(i) {
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.i === String(i))); });
    if (i === "weak") {
      eyebrow.textContent = "The weakest link";
      title.textContent = d.links[w.from - 1].stage + " to " + d.links[w.to - 1].stage;
      text.innerHTML = WS.cite(w.text.charAt(0).toUpperCase() + w.text.slice(1));
      return;
    }
    var l = d.links[i];
    eyebrow.textContent = "Link " + (Number(i) + 1) + " of 5";
    title.textContent = l.stage;
    var what = l.what.charAt(0).toUpperCase() + l.what.slice(1);
    text.innerHTML = WS.cite(what) + (l.verify ? "" : '<span class="assume" style="display:block"><strong>Assumes:</strong> ' +
      WS.cite(l.assumes.replace(/^Assumes\s+/, "")) + "</span>");
  }
  buttons.forEach(function (b) { b.addEventListener("click", function () { select(b.dataset.i === "weak" ? "weak" : Number(b.dataset.i)); }); });
  select(0);
})();
</script>
</body>
</html>
