<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The three questions — Watershed case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/watershed.css">
<style>
  .qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 28px; margin-top: 24px; }
  .q { border-top: 3px solid var(--navy); padding-top: 14px; }
  .q:nth-child(2) { border-top-color: var(--blue); }
  .q:nth-child(3) { border-top-color: var(--slate); }
  .q h3 { margin-bottom: 4px; }
  .q .mode { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .q ul { margin: 0; padding-left: 18px; }
  .q li { font-size: 0.97rem; margin-bottom: 10px; }
  .q li:last-child { margin-bottom: 0; }
  .q p.could { font-size: 1.02rem; }
</style>
</head>
<body>
<main class="wrap" aria-labelledby="t">
  <h2 id="t" class="sr-only">The three questions</h2>
  <div class="toggle" role="group" aria-label="Show">
    <button type="button" aria-pressed="true" data-mode="is">What is</button>
    <button type="button" aria-pressed="false" data-mode="could">What could be</button>
  </div>
  <div class="qs" id="qs" aria-live="polite"></div>
</main>
<script src="data.js"></script>
<script src="assets/case.js"></script>
<script>
(function () {
  var root = document.getElementById("qs");
  var c = WS.getCase();
  if (!c) { WS.missing(root); return; }
  var buttons = Array.prototype.slice.call(document.querySelectorAll("[data-mode]"));
  function render(mode) {
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.mode === mode)); });
    root.innerHTML = c.data.questions.filter(function (q) { return mode !== "is" || q.findings.length; }).map(function (q) {
      var body;
      if (mode === "is") {
        body = "<ul>" + q.findings.map(function (f) { return "<li>" + WS.cite(f.text) + "</li>"; }).join("") + "</ul>";
      } else {
        body = '<p class="could">' + WS.cite(q.could.charAt(0).toUpperCase() + q.could.slice(1)) + "</p>";
      }
      return '<section class="q"><h3>' + WS.esc(q.name) + '</h3><p class="mode">' +
        (mode === "is" ? "What is" : "What could be") + "</p>" + body + "</section>";
    }).join("");
  }
  buttons.forEach(function (b) { b.addEventListener("click", function () { render(b.dataset.mode); }); });
  render("is");
})();
</script>
</body>
</html>
