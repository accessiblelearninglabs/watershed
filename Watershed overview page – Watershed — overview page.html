<body>
  <div id="__bundler_placeholder">Loading Watershed — andrearobin.com...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"font-family: 'Asap', system-ui, sans-serif; color: #303e44; background: #ffffff; line-height: 1.65; font-size: 17px\" data-canvas-width=\"1280\" data-canvas-height=\"5200\" data-document-role=\"page\" data-label=\"Watershed — overview page\">\n\n<header style=\"border-bottom: 1px solid #d4dde1; padding: 72px 24px 48px\">\n<div style=\"max-width: 960px; margin: 0 auto\">\n<p style=\"margin: 0 0 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #5a717b\">Watershed<\u002Fp>\n<h1 style=\"margin: 0 0 24px; font-size: clamp(34px, 5vw, 52px); line-height: 1.15; font-weight: 500; letter-spacing: -0.01em; max-width: 780px\">What we are working on together in learning design, and where my practice joins it<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; color: #475f6a; max-width: 680px\">One problem, followed through five places where learning design helps decide how much is lost on the way: from research, to the people who need it, and back again.<\u002Fp>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"padding: 56px 24px 0\" aria-labelledby=\"concept\">\n<div style=\"max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px\">\n<div style=\"flex: 1 1 260px\">\n<p style=\"margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5a717b\">The idea<\u002Fp>\n<h2 id=\"concept\" style=\"margin: 0; font-size: 28px; font-weight: 500; line-height: 1.25\">Why a watershed<\u002Fh2>\n<\u002Fdiv>\n<div style=\"flex: 2 1 420px; display: flex; flex-direction: column; gap: 16px\">\n<p style=\"margin: 0\">A watershed is all the land that drains to one river. What happens upstream, where the rain falls and what the ground holds, decides what reaches the river downstream.<\u002Fp>\n<p style=\"margin: 0\">Learning design works the same way. Decisions made early, about who a resource is for and what it assumes, decide who can act on it later. Thousands of people already work on each part of this. My practice is one contribution among them, and this page shows where it joins.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 56px 24px 0\" aria-labelledby=\"problem\">\n<div style=\"max-width: 960px; margin: 0 auto\">\n<p style=\"margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5a717b\">The one problem<\u002Fp>\n<h2 id=\"problem\" style=\"margin: 0 0 28px; font-size: 28px; font-weight: 500; line-height: 1.25; max-width: 720px\">What is known does not reliably become what people can do.<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: #d4dde1; border: 1px solid #d4dde1\">\n<div style=\"background: #ffffff; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 40px; font-weight: 500; line-height: 1\">54.9%<\u002Fp>\n<p style=\"margin: 0; font-size: 15px\">of recommended care received by US adults, across 30 conditions.<\u002Fp>\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">McGlynn et al., 2003<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 40px; font-weight: 500; line-height: 1\">16.5%<\u002Fp>\n<p style=\"margin: 0; font-size: 15px\">of people with major depression, across 21 countries, received minimally adequate treatment.<\u002Fp>\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">Thornicroft et al., 2017<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 40px; font-weight: 500; line-height: 1\">~17 years<\u002Fp>\n<p style=\"margin: 0; font-size: 15px\">from research to practice: a figure three studies reached while measuring different stretches of the process.<\u002Fp>\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">Morris, Wooding &amp; Grant, 2011<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 64px 24px 0\" aria-labelledby=\"map\">\n<div style=\"max-width: 960px; margin: 0 auto\">\n<p style=\"margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5a717b\">The map<\u002Fp>\n<h2 id=\"map\" style=\"margin: 0 0 12px; font-size: 28px; font-weight: 500; line-height: 1.25\">Five tributaries, one river<\u002Fh2>\n<p style=\"margin: 0 0 28px; color: #475f6a; max-width: 680px\">Read in order, the five cases follow the water: evidence is made usable, usable by everyone, carried by trained people, and checked for whether practice changed. What the checking finds returns to the evidence.<\u002Fp>\n\n<div style=\"border: 1px solid #d4dde1; background: #f4f7f8; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px\">\n<div style=\"background: #ffffff; border: 1px solid #c3cfd4; padding: 16px; display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5a717b\">1 · SOURCE<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; font-weight: 500; line-height: 1.3\">Getting evidence into practice<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #c3cfd4; padding: 16px; display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5a717b\">2 · WHO CAN USE IT<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; font-weight: 500; line-height: 1.3\">Access that does not depend on asking<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #c3cfd4; padding: 16px; display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5a717b\">3 · WHO CARRIES IT<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; font-weight: 500; line-height: 1.3\">Preparing the people who carry care<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; border: 1px solid #c3cfd4; padding: 16px; display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5a717b\">4 · FEEDBACK<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; font-weight: 500; line-height: 1.3\">Knowing whether it worked<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #303e44; color: #ffffff; padding: 16px; display: flex; flex-direction: column; gap: 4px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #dce5e8\">THE RIVER<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; font-weight: 500; line-height: 1.3\">People able to act on what is known<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: #3d5560\">\n<p style=\"margin: 0\"><span aria-hidden=\"true\">→<\u002Fspan> Each stage flows into the next<\u002Fp>\n<p style=\"margin: 0\"><span aria-hidden=\"true\">↺<\u002Fspan> What stage 4 finds returns to stage 1<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px dashed #8fa4ad; background: #ffffff; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #5a717b\">5 · THE CLIMATE<\u002Fp>\n<p style=\"margin: 0; font-size: 16px; font-weight: 500\">Learning through the generative AI transition<\u002Fp>\n<p style=\"margin: 0; font-size: 14px; color: #475f6a\">changes how people learn and are assessed at every stage at once.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 64px 24px 0\" aria-labelledby=\"lens\">\n<div style=\"max-width: 960px; margin: 0 auto\">\n<p style=\"margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5a717b\">How each case is read<\u002Fp>\n<h2 id=\"lens\" style=\"margin: 0 0 12px; font-size: 28px; font-weight: 500; line-height: 1.25\">Three questions, asked of every case<\u002Fh2>\n<p style=\"margin: 0 0 28px; color: #475f6a; max-width: 680px\">Each case asks how much good solving the problem would do, and pairs every answer with what solving it would make possible.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px\">\n<div style=\"border-top: 2px solid #303e44; padding-top: 16px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 500\">Scale<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">If we solved it, how much better would things be, and for how many people?<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 2px solid #303e44; padding-top: 16px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 500\">Neglectedness<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">How few resources already go to it, and where does one more contributor add most?<\u002Fp>\n<\u002Fdiv>\n<div style=\"border-top: 2px solid #303e44; padding-top: 16px; display: flex; flex-direction: column; gap: 8px\">\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 500\">Solvability<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">How much of what remains would more effort solve, and what would it take?<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 28px 0 0; font-size: 15px; max-width: 760px\"><strong style=\"font-weight: 600\">A portfolio, not a ranking.<\u002Fstrong> Progress comes from many people contributing where they fit best. No one works on everything, and no case here is claimed as the most important problem in the world.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 64px 24px 0\" aria-labelledby=\"cases\">\n<div style=\"max-width: 960px; margin: 0 auto\">\n<p style=\"margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5a717b\">The cases<\u002Fp>\n<h2 id=\"cases\" style=\"margin: 0 0 12px; font-size: 28px; font-weight: 500; line-height: 1.25\">Five cases, each read the same way<\u002Fh2>\n<p style=\"margin: 0 0 28px; color: #475f6a; max-width: 680px\">Every case opens with what solving the problem would make possible, then the evidence, who already holds the work, a theory of change, where effort counts for more or less, open questions, and what has changed in my practice.<\u002Fp>\n\n<div style=\"display: flex; flex-direction: column; border-top: 1px solid #303e44\">\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 16px 32px; padding: 28px 0; border-bottom: 1px solid #d4dde1\">\n<p style=\"flex: 0 0 56px; margin: 0; font-size: 34px; font-weight: 500; line-height: 1; color: #475f6a\">01<\u002Fp>\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5a717b\">The source<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3\">Getting evidence into practice<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">How does research become something people can use where they work?<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\"><strong style=\"font-weight: 600; color: #303e44\">Ceiling:<\u002Fstrong> evidence arrives with a plan for how it will be used, shaped by the barriers of the place it is going.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 0 180px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; justify-content: center\">\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">Working draft<\u002Fp>\n<a href=\"/watershed/evidence-into-practice\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #303e44; color: #303e44; text-decoration: none; font-size: 15px; font-weight: 500\">Read the case <span aria-hidden=\"true\" style=\"margin-left: 8px\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 16px 32px; padding: 28px 0; border-bottom: 1px solid #d4dde1\">\n<p style=\"flex: 0 0 56px; margin: 0; font-size: 34px; font-weight: 500; line-height: 1; color: #475f6a\">02<\u002Fp>\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5a717b\">Who can use it<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3\">Access that does not depend on asking<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">How can learning reach disabled people without depending on a request?<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\"><strong style=\"font-weight: 600; color: #303e44\">Ceiling:<\u002Fstrong> materials disabled people can use on the same day as everyone else, with accommodation kept for needs that are genuinely individual.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 0 180px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; justify-content: center\">\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">Working draft<\u002Fp>\n<a href=\"/watershed/access-without-asking\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #303e44; color: #303e44; text-decoration: none; font-size: 15px; font-weight: 500\">Read the case <span aria-hidden=\"true\" style=\"margin-left: 8px\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 16px 32px; padding: 28px 0; border-bottom: 1px solid #d4dde1\">\n<p style=\"flex: 0 0 56px; margin: 0; font-size: 34px; font-weight: 500; line-height: 1; color: #475f6a\">03<\u002Fp>\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5a717b\">Who carries it<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3\">Preparing the people who carry care<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">How are community health workers and other non-specialist providers prepared, and supported after training?<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\"><strong style=\"font-weight: 600; color: #303e44\">Ceiling:<\u002Fstrong> training and supervision designed as one programme, so skills hold in routine care.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 0 180px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; justify-content: center\">\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">Working draft<\u002Fp>\n<a href=\"/watershed/preparing-people-who-carry-care\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #303e44; color: #303e44; text-decoration: none; font-size: 15px; font-weight: 500\">Read the case <span aria-hidden=\"true\" style=\"margin-left: 8px\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 16px 32px; padding: 28px 0; border-bottom: 1px solid #d4dde1\">\n<p style=\"flex: 0 0 56px; margin: 0; font-size: 34px; font-weight: 500; line-height: 1; color: #475f6a\">04<\u002Fp>\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5a717b\">The feedback loop<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3\">Knowing whether it worked<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">How can organizations find out which programs change practice, and act on what they find?<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\"><strong style=\"font-weight: 600; color: #303e44\">Ceiling:<\u002Fstrong> evaluation built in at design, measured by what people do afterwards, and returned to the evidence base.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 0 180px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; justify-content: center\">\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">Working draft<\u002Fp>\n<a href=\"/watershed/knowing-whether-it-worked\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #303e44; color: #303e44; text-decoration: none; font-size: 15px; font-weight: 500\">Read the case <span aria-hidden=\"true\" style=\"margin-left: 8px\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap; gap: 16px 32px; padding: 28px 0; border-bottom: 1px solid #d4dde1\">\n<p style=\"flex: 0 0 56px; margin: 0; font-size: 34px; font-weight: 500; line-height: 1; color: #475f6a\">05<\u002Fp>\n<div style=\"flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5a717b\">The climate<\u002Fp>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 500; line-height: 1.3\">Learning through the generative AI transition<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px\">How can assessment still show what a person can do?<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\"><strong style=\"font-weight: 600; color: #303e44\">Ceiling:<\u002Fstrong> AI used in ways that build learning people keep, with credentials that stay fair and valid for every learner.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 0 180px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; justify-content: center\">\n<p style=\"margin: 0; font-size: 13px; color: #5a717b\">Working draft<\u002Fp>\n<a href=\"/watershed/learning-through-ai\" style=\"display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid #303e44; color: #303e44; text-decoration: none; font-size: 15px; font-weight: 500\">Read the case <span aria-hidden=\"true\" style=\"margin-left: 8px\">→<\u002Fspan><\u002Fa>\n<\u002Fdiv>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 64px 24px 0\" aria-labelledby=\"toc\">\n<div style=\"max-width: 960px; margin: 0 auto\">\n<p style=\"margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5a717b\">The theory of change<\u002Fp>\n<h2 id=\"toc\" style=\"margin: 0 0 28px; font-size: 28px; font-weight: 500; line-height: 1.25\">How the five connect<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 1px; background: #d4dde1; border: 1px solid #d4dde1\">\n<div style=\"background: #ffffff; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px\">\n<p style=\"flex: 0 0 64px; margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #5a717b\">IF<\u002Fp>\n<p style=\"flex: 999 1 400px; margin: 0\">learning is designed from synthesised evidence and local barriers, with access built in from the first draft and disabled people leading, with support that continues after training, evaluated by what changes in practice, and assessed in ways that stay valid as AI changes how people learn,<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px\">\n<p style=\"flex: 0 0 64px; margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #5a717b\">THEN<\u002Fp>\n<p style=\"flex: 999 1 400px; margin: 0\">more people can act on what is known, more of the time,<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #ffffff; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 8px 24px\">\n<p style=\"flex: 0 0 64px; margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: #5a717b\">AND<\u002Fp>\n<p style=\"flex: 999 1 400px; margin: 0\">the field learns faster which designs work, because what evaluation finds returns to the evidence.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; font-size: 15px; color: #475f6a; max-width: 760px\">This holds only where conditions outside design are in place or held by partners: funded posts, devices and connectivity, time, supplies and management support. It claims contribution, not sole cause.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 64px 24px 0\" aria-labelledby=\"practice\">\n<div style=\"max-width: 960px; margin: 0 auto\">\n<p style=\"margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #5a717b\">My practice<\u002Fp>\n<h2 id=\"practice\" style=\"margin: 0 0 12px; font-size: 28px; font-weight: 500; line-height: 1.25\">How I know it is working, and that it does not depend on me<\u002Fh2>\n<p style=\"margin: 0 0 28px; color: #475f6a; max-width: 680px\">The aim is a method practised by people who have never worked with me, and resources that others adapt, maintain and improve. Each case reports against six levels.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 1px; background: #d4dde1; border: 1px solid #d4dde1\">\n<div style=\"background: #ffffff; padding: 18px 20px\"><p style=\"margin: 0 0 4px; font-weight: 600; font-size: 15px\">Reach<\u002Fp><p style=\"margin: 0; font-size: 15px; color: #475f6a\">Did it reach the people the default usually misses?<\u002Fp><\u002Fdiv>\n<div style=\"background: #ffffff; padding: 18px 20px\"><p style=\"margin: 0 0 4px; font-weight: 600; font-size: 15px\">Adoption<\u002Fp><p style=\"margin: 0; font-size: 15px; color: #475f6a\">Are others choosing to use or adapt it?<\u002Fp><\u002Fdiv>\n<div style=\"background: #ffffff; padding: 18px 20px\"><p style=\"margin: 0 0 4px; font-weight: 600; font-size: 15px\">Practice<\u002Fp><p style=\"margin: 0; font-size: 15px; color: #475f6a\">Did what people do change, checked at 60 to 90 days?<\u002Fp><\u002Fdiv>\n<div style=\"background: #ffffff; padding: 18px 20px\"><p style=\"margin: 0 0 4px; font-weight: 600; font-size: 15px\">Maintenance<\u002Fp><p style=\"margin: 0; font-size: 15px; color: #475f6a\">Is it kept current by someone other than me?<\u002Fp><\u002Fdiv>\n<div style=\"background: #ffffff; padding: 18px 20px\"><p style=\"margin: 0 0 4px; font-weight: 600; font-size: 15px\">Embedding<\u002Fp><p style=\"margin: 0; font-size: 15px; color: #475f6a\">Is it in a template, procedure or standard?<\u002Fp><\u002Fdiv>\n<div style=\"background: #ffffff; padding: 18px 20px\"><p style=\"margin: 0 0 4px; font-weight: 600; font-size: 15px\">Field<\u002Fp><p style=\"margin: 0; font-size: 15px; color: #475f6a\">Is it being cited, critiqued or built on?<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 24px; background: #303e44; color: #ffffff; padding: 24px 28px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #dce5e8\">The handover test, once a year<\u002Fp>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.55\">If I stepped away for twelve months, what would still be running, who would maintain it, and would it still be improving?<\u002Fp>\n<p style=\"margin: 0; font-size: 14px; color: #dce5e8\">Last answered: [DATE] · <a href=\"/watershed/handover\" style=\"color: #ffffff\">Read this year's answer<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; font-size: 15px; max-width: 760px\">The methods behind this are written down so others can practise them: <a href=\"/groundwork\">Groundwork<\u002Fa> for learning design, and Fieldwork, at <a href=\"https://accessiblelearninglabs.com\">Accessible Learning Labs<\u002Fa>, for accessibility and inclusive design.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 64px 24px 72px\" aria-labelledby=\"reading\">\n<div style=\"max-width: 960px; margin: 0 auto; border-top: 1px solid #d4dde1; padding-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px\">\n<div>\n<h2 id=\"reading\" style=\"margin: 0 0 8px; font-size: 17px; font-weight: 600\">How claims are handled<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\">Every figure is traced to what it measures. Sources still being checked are marked [verify] on the case pages.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2 style=\"margin: 0 0 8px; font-size: 17px; font-weight: 600\">Language<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\">This page uses identity-first language (disabled people), following the social model of disability, and keeps each source's own terms when quoting it.<\u002Fp>\n<\u002Fdiv>\n<div>\n<h2 style=\"margin: 0 0 8px; font-size: 17px; font-weight: 600\">Last reviewed<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; color: #475f6a\">[DATE]. Corrections and challenges are welcome: <a href=\"/contact\">get in touch<\u002Fa>.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:5200}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
